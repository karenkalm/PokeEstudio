name: pokestudio
description: "PokéStudio · Pokédex, colección y centro táctico hecho por fans con Flutter y PokéAPI."
publish_to: "none"

version: 0.2.0+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # Material Design vive ahora en su propio paquete oficial (antes era
  # package:flutter/material.dart). go_router 18 y cached_network_image 4 ya
  # dependen de él, así que toda la app lo usa para tener un único Theme.
  material_ui: ^1.7.0

  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  http: ^1.5.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  cached_network_image: ^4.0.4
  flutter_cache_manager: ^3.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/fonts/fredoka/OFL.txt
    - assets/fonts/nunito/OFL.txt
    - assets/fonts/press_start_2p/OFL.txt

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/fredoka/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/fredoka/Fredoka-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/nunito/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/nunito/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/nunito/Nunito-ExtraBold.ttf
          weight: 800
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/press_start_2p/PressStart2P-Regular.ttf
