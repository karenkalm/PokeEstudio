name: pokestudio
description: "PokéStudio · Pokédex, colección y centro táctico hecho por fans con Flutter y PokéAPI."
publish_to: "none"

version: 0.2.0+2

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Versiones elegidas para funcionar desde Flutter 3.38 (Dart 3.10).
  # go_router 18 y cached_network_image 4 exigen Flutter 3.44+ (paquete
  # material_ui), por eso aquí se usan sus series 17.x y 3.x.
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  http: ^1.5.0
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/sounds/
    - assets/fonts/fredoka/OFL.txt
    - assets/fonts/nunito/OFL.txt
    - assets/fonts/press_start_2p/OFL.txt

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/fredoka/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/fredoka/Fredoka-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/nunito/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/nunito/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/nunito/Nunito-ExtraBold.ttf
          weight: 800
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/press_start_2p/PressStart2P-Regular.ttf
