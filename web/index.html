<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Flutter reemplaza $FLUTTER_BASE_HREF con el valor de --base-href al
    compilar (GitHub Pages usa "/NombreDelRepositorio/").
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PokéStudio: una Pokédex retro y tierna con datos reales de PokéAPI. Proyecto de fans no oficial.">
  <meta name="theme-color" content="#FFF7E8">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PokéStudio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>PokéStudio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #FFF7E8;
    }
    /* Pantalla de carga: se ve mientras se descarga la app y se quita con el
       primer cuadro de Flutter. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #FFF7E8;
      color: #563B2B;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 240ms ease-out;
      z-index: 10;
    }
    #splash img {
      width: 96px;
      height: 96px;
      animation: bob 1.2s ease-in-out infinite;
    }
    #splash .name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    #splash .name span { color: #C73A3A; }
    #splash .hint { font-size: 15px; opacity: 0.75; }
    #splash .bar {
      width: 180px;
      height: 10px;
      border: 2px solid #563B2B;
      border-radius: 8px;
      overflow: hidden;
      background: #FFFFFF;
    }
    #splash .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: #FFD95A;
      animation: slide 1.1s ease-in-out infinite;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash img, #splash .bar::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="name"><span>Poké</span>Studio</div>
    <div class="bar" aria-hidden="true"></div>
    <div class="hint">Cargando la Pokédex…</div>
  </div>
  <script>
    (function () {
      function hideSplash() {
        var splash = document.getElementById('splash');
        if (!splash || splash.classList.contains('hidden')) return;
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 300);
      }
      // Flutter avisa cuando pinta su primer cuadro.
      window.addEventListener('flutter-first-frame', hideSplash);
      // Respaldo: si el aviso no llega, se quita poco después de que Flutter
      // inserte su vista en la página.
      var observer = new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          observer.disconnect();
          setTimeout(hideSplash, 2500);
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
